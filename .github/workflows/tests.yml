name: tests

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install
        run: python -m pip install -r requirements.txt
      - name: Unit tests (18)
        run: python -m pytest -q
      - name: Build Building Memory
        run: python -m app.ingest
        env:
          PYTHONUTF8: "1"
      - name: Cold-night simulation
        run: python -m app.simulate
        env:
          PYTHONUTF8: "1"
      - name: Triage eval
        run: python -m eval.run_eval --holdout
        env:
          PYTHONUTF8: "1"
